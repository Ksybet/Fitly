          type: integer
          minimum: 0
          maximum: 10080
          description: Значение по умолчанию для новых планов тренировок; существующие планы не пересчитываются.
        achievementsEnabled:
          type: boolean
          description: Управляет push о достижениях; сами достижения всегда сохраняются в истории.
        doNotDisturbEnabled:
          type: boolean
          description: При включении требует одновременно `doNotDisturbFrom` и `doNotDisturbTo`. В этот период push для water, sleep и workout пропускается, а achievement, system и support откладывается до конца интервала; история сохраняется.
        doNotDisturbFrom:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        doNotDisturbTo:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    UserSettings:
      type: object
      required: [theme, language, timezone, quickAction, aiEnabled, notifications, updatedAt]
      properties:
        theme:
          allOf:
            - $ref: '#/components/schemas/Theme'
          default: system
        language:
          type: string
          example: ru
          maxLength: 10
          default: ru
        timezone:
          type: string
          description: IANA timezone, например `Europe/Tallinn`.
          example: Europe/Tallinn
          maxLength: 100
          default: UTC
        quickAction:
          allOf:
            - $ref: '#/components/schemas/QuickAction'
          default: water
        aiEnabled:
          type: boolean
          default: false
        notifications:
          allOf:
            - $ref: '#/components/schemas/NotificationPreferences'
          default: {}
        updatedAt:
          type: string
          format: date-time
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme:
          $ref: '#/components/schemas/Theme'
        language:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 100
        quickAction:
          $ref: '#/components/schemas/QuickAction'
        aiEnabled:
          type: boolean
        notifications:
          $ref: '#/components/schemas/NotificationPreferences'
    DeviceRequest:
      type: object
      additionalProperties: false
      required: [platform, pushToken]
      properties:
        platform:
          type: string
          enum: [ios, android]
        pushToken:
          type: string
          minLength: 20
          maxLength: 4096
          description: Expo Push Token, полученный мобильным клиентом через `getExpoPushTokenAsync`.
        appVersion:
          type: string
          maxLength: 30
    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceRequest'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    NotificationType:
      type: string
      enum: [water, sleep, workout, achievement, system, support]
    NotificationStatus:
      type: string
      description: Публичный статус записи истории. Ошибки отдельных push-устройств хранятся во внутренних delivery-статусах и не добавляют значение `failed` в этот enum.
      enum: [created, scheduled, sent, read, cancelled]
    Notification:
      type: object
      required: [id, type, title, body, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AnalyticsPeriod:
      type: string
      enum: [week, month, year]
      description: Календарный период к указанной конечной дате включительно.
    TimeSeriesPoint:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
        secondaryValue:
          type: number
          nullable: true
    ActivityPoint:
      type: object
      required: [date, steps, workoutMinutes, caloriesBurned]
      properties:
        date:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
        workoutMinutes:
          type: integer
          minimum: 0
        caloriesBurned:
          type: number
          minimum: 0
    PeriodRange:
      type: object
      required: [period, from, to]
      properties:
        period:
          $ref: '#/components/schemas/AnalyticsPeriod'
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    WorkoutMetrics:
      type: object
      required: [workoutCount, totalMinutes, caloriesBurned]
      properties:
        workoutCount:
          type: integer
          minimum: 0
        totalMinutes:
          type: integer
          minimum: 0
        caloriesBurned:
          type: number
          minimum: 0
    AnalyticsSummary:
      type: object
      description: |
        Суммарные показатели за календарный диапазон. Изменение веса и ИМТ
        округляются до двух знаков, средняя длительность сна и вода — до целого,
        среднее качество сна и настроение — до одного знака. При отсутствии
        исходных записей вес, изменение веса, ИМТ, показатели сна и настроение
        равны `null`; суммарные показатели равны нулю.
      required: [range, latestWeightKg, weightChangeKg, bmi, averageSleepMinutes, averageSleepQuality, totalWaterMl, averageDailyWaterMl, totalSteps, nutrition, workouts, averageMoodScore]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        latestWeightKg:
          type: number
          nullable: true
        weightChangeKg:
          type: number
          nullable: true
        bmi:
          type: number
          nullable: true
        averageSleepMinutes:
          type: number
          nullable: true
        averageSleepQuality:
          type: number
          nullable: true
        totalWaterMl:
          type: integer
          minimum: 0
        averageDailyWaterMl:
          type: number
          minimum: 0
          multipleOf: 1
        totalSteps:
          type: integer
          minimum: 0
        nutrition:
          $ref: '#/components/schemas/RoundedNutritionValues'
        workouts:
          $ref: '#/components/schemas/WorkoutMetrics'
        averageMoodScore:
          type: number
          nullable: true
    WeightAnalytics:
      type: object
      required: [range, currentWeightKg, changeKg, bmi, points]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        currentWeightKg:
          type: number
          nullable: true
        changeKg:
          type: number
          nullable: true
        bmi:
          type: number
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
    ActivityAnalytics:
      type: object
      required: [range, workouts, totalSteps, points]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        workouts:
          $ref: '#/components/schemas/WorkoutMetrics'
        totalSteps:
          type: integer
          minimum: 0
        points:
          type: array
          description: |
            По одной точке на каждый день диапазона, включая пустые дни;
            `steps` — шаги, `workoutMinutes` — полные минуты и
            `caloriesBurned` — калории завершённых тренировок по локальной
            дате `finishedAt`.
          items:
            $ref: '#/components/schemas/ActivityPoint'
    SleepAnalytics:
      type: object
      required: [range, averageDurationMinutes, averageQuality, points]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        averageDurationMinutes:
          type: number
          nullable: true
        averageQuality:
          type: number
          nullable: true
        points:
          type: array
          description: |
            `value` — длительность, округлённая до целой минуты;
            `secondaryValue` — качество 1–5.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
    NutritionAnalytics:
      type: object
      required: [range, totals, averages, points]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        totals:
          $ref: '#/components/schemas/NutritionValues'
        averages:
          $ref: '#/components/schemas/NutritionValues'
        points:
          type: array
          description: '`value` — калории за день.'
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
    MoodAnalytics:
      type: object
      required: [range, averageMoodScore, points, topTags, topSymptoms]
      properties:
        range:
          $ref: '#/components/schemas/PeriodRange'
        averageMoodScore:
          type: number
          nullable: true
        points:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        topTags:
          type: array
          items:
            type: string
        topSymptoms:
          type: array
          items:
            type: string

