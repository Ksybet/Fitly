      operationId: getAnalyticsSummary
      summary: Получить единую сводку здоровья
      description: |
        Возвращает итоговые показатели от начала выбранного календарного периода
        до `endDate` включительно: с понедельника для `week`, с первого числа для
        `month` и с 1 января для `year`.

        Последний вес и ИМТ рассчитываются по записи не позднее `endDate`, а
        изменение веса — только между первой и последней записями внутри периода.
        Среднее потребление воды делится на число всех календарных дней диапазона,
        включая дни без записей, и округляется до целого миллилитра.
      x-requirements: [FR-1008, FITLY-049]
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodEndDate'
      responses:
        '200':
          description: Агрегированная сводка
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

