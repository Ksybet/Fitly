openapi: 3.0.3
info:
  title: Fitly API
  version: 1.0.0
  license:
    name: Internal educational project; no license granted
  description: |
    Контракт REST API мобильного приложения Fitly. Это единый источник
    истины для backend, frontend, тестов, mock-сервера и документации. Если код
    расходится с этим файлом, исправляется код либо контракт меняется отдельным
    согласованным изменением до реализации.

    Источники требований: SRS Fitly, карточки FITLY-001—FITLY-077 и фактический
    контракт текущего приложения. При конфликте сохранена обратная совместимость
    существующих `/api/v1` endpoints, а бизнес-правила уточнены по SRS и Trello.

    ## 1. Общие правила

    * Запросы и JSON-ответы используют `Content-Type: application/json`.
    * Имена JSON-полей используют `camelCase`. Frontend не должен самостоятельно
      переименовывать поля в `snake_case` и обратно.
    * Поле, отсутствующее в JSON, и поле со значением `null` — разные состояния.
      `null` разрешён только там, где схема явно содержит `nullable: true`.
    * Неизвестные поля нельзя отправлять в объекты с `additionalProperties: false`.
    * Даты без времени передаются как `YYYY-MM-DD`, моменты времени — в формате
      RFC 3339, например `2026-07-16T14:30:00Z`.
    * Сервер хранит моменты времени в UTC. Дневные границы и отображение считаются
      в часовом поясе из настроек пользователя.
    * Идентификаторы сущностей — положительные 64-битные целые числа.
    * Пользователь получает доступ только к собственным данным. `userId` не
      передаётся в пользовательских request body и определяется по access JWT.
    * Удаление возвращает JSON-подтверждение `{ "success": true, "data":
      { "deleted": true } }`, а не пустой ответ `204`.
    * Конкретная схема операции важнее общих соглашений. Например, совместимый
      `PUT /profile` обновляет только переданные поля, хотя обычно `PUT` означает
      полную замену ресурса.

    ## 2. Авторизация и токены

    По умолчанию все операции защищены схемой `bearerAuth`. Публичные операции
    (`register`, `login`, `refresh`, восстановление пароля и health check) явно
    содержат `security: []`.

    Access JWT передаётся только в HTTP-заголовке:

    ```http
    Authorization: Bearer <token>
    ```

    После регистрации или входа сервер возвращает `data.token`,
    `data.refreshToken`, `data.tokenType` и `data.expiresIn`. Имя `token` означает
    access token и сохранено для совместимости с существующим приложением.
    Refresh-токен не используется как Bearer-токен: он отправляется только в body
    операций `/auth/refresh` и завершения соответствующей сессии.

    Если защищённая операция вернула `401`, frontend может один раз вызвать
    `/auth/refresh`, сохранить новую пару токенов и повторить исходный запрос.
    Несколько параллельных `401` должны ожидать один общий refresh-запрос. Если
    refresh также завершился ошибкой, frontend удаляет локальные токены и
    переводит пользователя на экран входа. Бесконечно повторять запрос нельзя.

    ## 3. Успешный ответ

    Все успешные JSON-ответы используют envelope:

    ```json
    {
      "success": true,
      "data": {
        "id": 42
      },
      "meta": {
        "requestId": "req_01J0Y7Y0QZ5M4X2D7F8A"
      }
    }
    ```

    * `success` всегда равен `true`.
    * `data` содержит полезную нагрузку конкретной операции. Её структура
      определяется схемой ответа этой операции.
    * `meta` содержит служебную информацию и может отсутствовать, если операция
      не объявляет её обязательной.
    * В списках `meta` обязателен и дополнительно содержит `page`, `pageSize`,
      `total` и `totalPages`.

    HTTP-код остаётся значимым: `200` — успешное чтение/изменение, `201` — ресурс
    создан, `202` — асинхронная задача принята и ещё не завершена.

    ## 4. Ошибка

    Все ошибки API с JSON-body используют один envelope:

    ```json
    {
      "success": false,
      "message": "Проверьте введённые данные",
      "error": {
        "code": "VALIDATION_ERROR",
        "requestId": "req_01J0Y7Y0QZ5M4X2D7F8A",
        "details": [
          {
            "field": "password",
            "code": "PASSWORD_TOO_WEAK",
            "message": "Пароль не соответствует требованиям"
          }
        ]
      }
    }
    ```

    * `success` всегда равен `false`.
    * `message` — безопасное человекочитаемое сообщение. Его можно показать
      пользователю как общий fallback, но нельзя использовать для ветвления
      логики: текст может измениться или быть локализован.
    * `error.code` — стабильный машинный код в `UPPER_SNAKE_CASE`. Frontend
      принимает решения по HTTP-статусу и этому коду.
    * `error.requestId` — идентификатор конкретного HTTP-запроса. Frontend
      сохраняет или показывает его при диагностике, backend пишет тот же ID во
      все логи данного запроса.
    * `error.details` — необязательный массив уточнений. Обычно применяется для
      ошибок валидации нескольких полей.
    * `details[].field` — путь к полю запроса в `camelCase`, например `email` или
      `goals[0].targetValue`. Может отсутствовать у ошибки, не связанной с полем.
    * `details[].code` — необязательный машинный код конкретной ошибки поля.
    * `details[].message` — безопасное сообщение о конкретной проблеме.

    Backend не должен возвращать stack trace, SQL, имя таблицы, внутреннее имя
    класса, токен или другое секретное значение ни в `message`, ни в `details`.

    Основные HTTP-статусы:

    * `400` — неправильный формат или валидация входных данных;
    * `401` — access token отсутствует, истёк или недействителен;
    * `403` — пользователь распознан, но не имеет права или Premium-доступа;
    * `404` — ресурс не найден либо не принадлежит текущему пользователю;
    * `409` — конфликт с текущим состоянием или уникальностью данных;
    * `410` — ссылка, код или ресурс окончательно истёк;
    * `413` — файл или тело запроса превышает допустимый размер;
    * `429` — превышен лимит; учитывается заголовок `Retry-After`;
    * `503` — внешняя зависимость или сервис временно недоступны.

    ## 5. Request ID и логирование

    Request ID создаётся самым первым middleware до авторизации и валидации.
    Для успешного JSON-ответа он может находиться в `meta.requestId`, для ошибки
    обязательно возвращается в `error.requestId`. Один и тот же ID используется
    во всех структурированных логах запроса вместе с методом, путём, HTTP-кодом,
    длительностью и, после успешной авторизации, `userId`.

    Пароли, JWT, refresh-токены, секреты и платёжные данные не логируются.

    ## 6. Правила frontend

    * Использовать сгенерированные из OpenAPI типы и единый HTTP-клиент.
    * Bearer access token добавлять interceptor-ом, а не из каждого экрана.
    * На `2xx` читать полезные данные из `data`.
    * На `400` связывать `error.details` с полями формы.
    * На `401` выполнять не более одной попытки refresh и повтора запроса.
    * На остальных ошибках обрабатывать `error.code`, а `message` использовать
      как текст для пользователя.
    * При сообщении об ошибке разработчикам прикладывать `error.requestId`.

    ## 7. Правила backend

    Порядок обработки: request ID и логирование → разбор Bearer-токена →
    проверка роли → валидация параметров/body → бизнес-логика → mapping DTO →
    envelope ответа. Все исключения проходят через единый error handler и
    преобразуются в описанную выше структуру.

    Медицинские рекомендации не входят в область ответственности API. Ответы
    AI имеют информационный характер и не заменяют консультацию специалиста.
  contact:
    name: Fitly development team
servers:
  - url: https://api.fitlyapp.ru
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
    description: Состояние сервиса.
  - name: Auth
    description: Регистрация, сессии и безопасность аккаунта.
  - name: Profile
    description: Личные и антропометрические данные.
  - name: Goals
    description: Персональные цели и их состояния.
  - name: Daily tracking
    description: Совместимые singleton-endpoints текущего приложения.
  - name: Health
    description: История веса, сна, воды и шагов.
  - name: Diary
    description: Быстрые и расширенные записи самочувствия.
  - name: Nutrition
    description: Продукты, приёмы пищи и КБЖУ.
  - name: Workouts
    description: Каталог, таймер, журнал и календарь тренировок.
  - name: Achievements
    description: Справочник наград и прогресс пользователя.
  - name: Settings
    description: Интерфейс, локаль, быстрые действия и напоминания.
  - name: Notifications
    description: Push-устройства и история уведомлений.
  - name: Analytics
    description: Агрегаты и временные ряды для графиков.
  - name: Exports
    description: Асинхронное формирование CSV и PDF.
  - name: Support
    description: Обращения пользователя и переписка с поддержкой.
  - name: AI
    description: Premium-функции ИИ с обязательным предупреждением.
  - name: Subscription
    description: Тарифы, пробный период и проверка покупок.
  - name: Admin
    description: Методы только для роли администратора.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Проверить доступность API и базы данных
      security: []
      x-requirements: [FITLY-029]
      responses:
        '200':
          description: API и база данных доступны
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зарегистрироваться и автоматически войти
      description: Email уникален без учёта регистра.
      security: []
      x-requirements: [FR-101, FR-104, FITLY-006, FITLY-019, FITLY-033, FITLY-035]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти по email и паролю
      description: Поле `login` содержит email и сохранено для совместимости.
      security: []
      x-requirements: [FR-102, FR-1102, FITLY-007, FITLY-016, FITLY-021, FITLY-035]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный email или пароль; конкретное поле не раскрывается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Неверный email или пароль
                error:
                  code: INVALID_CREDENTIALS
                  requestId: req_01J0Y7Y0QZ5M4X2D7F8A
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Обновить пару токенов
      description: Refresh-токен одноразово ротируется; предыдущий становится недействительным.
      security: []
      x-requirements: [FITLY-028, FITLY-053]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токены обновлены
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти и инвалидировать refresh-токен
      x-requirements: [FR-105, FITLY-053]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Завершить все сессии пользователя
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Получить текущего пользователя
      x-requirements: [FITLY-028]
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Запросить ссылку восстановления пароля
      description: Всегда возвращает одинаковый ответ, чтобы не раскрывать наличие email.
      security: []
      x-requirements: [FR-103, FITLY-032, FITLY-034]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Установить новый пароль по одноразовому токену
      security: []
      x-requirements: [FR-103, FR-104, FITLY-034]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: Токен просрочен или уже использован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/password:
    patch:
      tags: [Auth]
      operationId: changePassword
      summary: Изменить пароль
      description: После изменения пароля все остальные сессии завершаются.
      x-requirements: [FR-303, FR-104, FITLY-060]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/email-change/request:
    post:
      tags: [Auth]
      operationId: requestEmailChange
      summary: Запросить изменение email
      x-requirements: [FR-302, FITLY-011]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/email-change/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailChange
      summary: Подтвердить новый email
      x-requirements: [FR-302, FITLY-011]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '410':
          description: Токен просрочен или уже использован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/account:
    delete:
      tags: [Auth]
      operationId: deleteAccount
      summary: Безвозвратно удалить аккаунт и персональные данные
      x-requirements: [FR-201, FITLY-018]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password:
                  type: string
                  format: password
                confirmation:
                  type: string
                  enum: [DELETE]
      responses:
        '200':
          $ref: '#/components/responses/ActionCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Access-токен недействителен либо указан неверный текущий пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    success: false
                    message: Требуется авторизация
                    error:
                      code: UNAUTHORIZED
                      requestId: req_01J0Y7Y0QZ5M4X2D7F8A
                invalidCredentials:
                  value:
                    success: false
                    message: Неверный пароль
                    error:
                      code: INVALID_CREDENTIALS
                      requestId: req_01J0Y7Y0QZ5M4X2D7F8A

  /api/v1/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Получить профиль и актуальные антропометрические данные
      x-requirements: [FR-301, FITLY-010, FITLY-068]
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Частично обновить профиль
      description: |
        Несмотря на `PUT`, поля необязательны и обновляются частично — это
        сохранённое поведение текущего клиента. Email меняется отдельным
        подтверждаемым сценарием.
      x-requirements: [FR-302, FITLY-011]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/goals:
    get:
      tags: [Goals]
      operationId: listGoals
      summary: Получить цели пользователя
      x-requirements: [FR-901, FR-902, FITLY-045]
      responses:
        '200':
          description: Список целей
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [goals]
                        properties:
