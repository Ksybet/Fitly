          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Короткоживущий access JWT из поля `data.token`, полученного при входе,
        регистрации или refresh. Frontend передаёт его как
        `Authorization: Bearer <token>`. Refresh-токен здесь не используется.

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      description: Начальная локальная дата включительно.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      description: Конечная локальная дата включительно.
      schema:
        type: string
        format: date
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/AnalyticsPeriod'
    PeriodEndDate:
      name: endDate
      in: query
      description: Последний день периода; по умолчанию сегодня в часовом поясе пользователя.
      schema:
        type: string
        format: date
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MealId:
      name: mealId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkoutId:
      name: workoutId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 2147483647
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AchievementId:
      name: achievementId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SupportRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    ActionCompleted:
      description: Действие выполнено
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ActionResult'
    Deleted:
      description: Ресурс удалён или деактивирован
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeleteResult'
    ValidationError:
      description: Ошибка синтаксиса или валидации полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Проверьте введённые данные
            error:
              code: VALIDATION_ERROR
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
              details:
                - field: password
                  code: PASSWORD_TOO_WEAK
                  message: Пароль не соответствует требованиям
    Unauthorized:
      description: Access- или refresh-токен отсутствует, истёк, отозван или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Требуется авторизация
            error:
              code: UNAUTHORIZED
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    Forbidden:
      description: Недостаточно прав для действия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Доступ запрещён
            error:
              code: FORBIDDEN
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    PremiumOrAiDisabled:
      description: Нет активного Premium либо ИИ отключён в настройках
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            premiumRequired:
              value:
                success: false
                message: Требуется Premium
                error:
                  code: PREMIUM_REQUIRED
                  requestId: req_01J0Y7Y0QZ5M4X2D7F8A
            aiDisabled:
              value:
                success: false
                message: ИИ-помощник отключён
                error:
                  code: AI_DISABLED
                  requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    NotFound:
      description: Ресурс не найден или не принадлежит текущему пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Ресурс не найден
            error:
              code: NOT_FOUND
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    Conflict:
      description: Операция конфликтует с текущим состоянием ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Операция недоступна в текущем состоянии
            error:
              code: STATE_CONFLICT
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Слишком много запросов
            error:
              code: RATE_LIMIT_EXCEEDED
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A
    ServiceUnavailable:
      description: Зависимость API временно недоступна
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Сервис временно недоступен
            error:
              code: SERVICE_UNAVAILABLE
              requestId: req_01J0Y7Y0QZ5M4X2D7F8A

  schemas:
    SuccessEnvelope:
      type: object
      description: |
        Базовая оболочка успешного JSON-ответа. Конкретная операция добавляет
        обязательное поле `data` через `allOf`. Frontend читает бизнес-данные из
        `data`, а не из корня ответа.
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Признак успешного ответа; в этой оболочке всегда `true`.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PaginatedEnvelope:
      type: object
      description: Оболочка списка с обязательными метаданными пагинации.
      required: [success, meta]
      properties:
        success:
          type: boolean
          enum: [true]
          description: Признак успешного ответа; всегда `true`.
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ResponseMeta:
      type: object
      description: Служебные метаданные ответа, не относящиеся к бизнес-сущности.
      properties:
        requestId:
          type: string
          description: |
            Идентификатор HTTP-запроса для сопоставления клиентской ошибки с
            backend-логами. Не является ID бизнес-сущности и не переиспользуется
            для другого запроса.
          example: req_01J0Y7Y0QZ5M4X2D7F8A
    PaginationMeta:
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          description: Метаданные постраничного списка; нумерация начинается с 1.
          required: [page, pageSize, total, totalPages]
          properties:
            page:
              type: integer
              minimum: 1
              description: Номер текущей страницы, начиная с 1.
            pageSize:
              type: integer
              minimum: 1
              description: Фактический максимальный размер страницы.
            total:
              type: integer
              minimum: 0
              description: Общее количество элементов с учётом фильтров.
            totalPages:
              type: integer
              minimum: 0
              description: Общее количество страниц; 0 для пустой выборки.
    ErrorResponse:
      type: object
      description: |
        Единая оболочка ошибки. Frontend использует HTTP-статус и `error.code`
        для логики, `message` — для отображения, `error.requestId` — для
        диагностики. Внутренние сведения сервера в ответ не включаются.
      required: [success, message, error]
      properties:
        success:
          type: boolean
          enum: [false]
          description: Признак ошибки; в этой оболочке всегда `false`.
        message:
          type: string
          description: |
            Безопасное человекочитаемое общее сообщение. Не является стабильным
            API-кодом и не должно использоваться во frontend-условиях.
        error:
          $ref: '#/components/schemas/ErrorInfo'
    ErrorInfo:
      type: object
      description: Машиночитаемая и диагностическая часть ошибки.
      required: [code, requestId]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: |
            Стабильный код причины в `UPPER_SNAKE_CASE`, например
            `VALIDATION_ERROR`, `INVALID_CREDENTIALS` или `PREMIUM_REQUIRED`.
        requestId:
          type: string
          description: |
            Уникальный ID текущего HTTP-запроса. Должен совпадать с ID в
            backend-логах и передаваться разработчикам при разборе проблемы.
          example: req_01J0Y7Y0QZ5M4X2D7F8A
        details:
          type: array
          description: |
            Необязательные уточнения. Для `VALIDATION_ERROR` обычно содержит по
            одному элементу для каждого некорректного поля.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: Деталь ошибки поля либо отдельной части запроса.
      required: [message]
      properties:
        field:
          type: string
          description: |
            Путь к полю в `camelCase`, например `email` или
            `goals[0].targetValue`. Отсутствует, если проблема не относится к полю.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Необязательный стабильный код конкретной проблемы поля.
        message:
          type: string
          description: Безопасное человекочитаемое описание проблемы.
    ActionResult:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
          enum: [true]
    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          enum: [true]
    HealthStatus:
      type: object
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [user, admin]
    UserStatus:
      type: string
      enum: [active, blocked, deleted]
    AdminUserStatus:
      type: string
      enum: [active, blocked]
    User:
      type: object
      required: [id, email, role, status, emailVerified, createdAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        emailVerified:
          type: boolean
        appVersion:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      pattern: '^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}$'
      description: Минимум 8 символов, одна заглавная латинская буква, цифра и спецсимвол.
      example: Fitly#2026
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: '#/components/schemas/Password'
        passwordConfirmation:
          type: string
          format: password
          description: Если передано, должно совпадать с `password`.
        appVersion:
          type: string
          maxLength: 30
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
        appVersion:
          type: string
          maxLength: 30
    AuthTokens:
      type: object
      description: |
        Пара access/refresh-токенов. `token` передаётся как Bearer при обращении
        к защищённым операциям; `refreshToken` используется только для обновления
        или завершения сессии и не передаётся как Bearer.
      required: [token, refreshToken, tokenType, expiresIn]
      properties:
        token:
          type: string
          description: Access JWT; имя `token` сохранено для совместимости.
        refreshToken:
          type: string
          description: |
            Одноразово ротируемый токен сессии. После успешного refresh frontend
            заменяет и access token, и refresh token на новую пару.
        tokenType:
          type: string
          enum: [Bearer]
          description: Схема передачи access token в заголовке Authorization.
        expiresIn:
          type: integer
          description: Срок жизни access-токена в секундах.
          minimum: 60
    AuthData:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AuthData'
    RefreshTokenRequest:
      type: object
      description: |
        Тело операции с серверной сессией. Здесь передаётся refresh-токен, а не
        access JWT. Конкретное действие — ротация или завершение сессии — задаётся
        выбранной операцией.
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 20
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 20
        newPassword:
          $ref: '#/components/schemas/Password'
        newPasswordConfirmation:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          $ref: '#/components/schemas/Password'
        newPasswordConfirmation:
          type: string
          format: password
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 254
        currentPassword:
          type: string
          format: password

    Gender:
      type: string
      enum: [male, female, other, prefer_not_to_say]
    Profile:
      type: object
      required: [userId, email, firstName, birthDate, gender, heightCm, weightKg, updatedAt]
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        age:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
        gender:
          type: string
          allOf:
            - $ref: '#/components/schemas/Gender'
          nullable: true
        heightCm:
          type: number
          format: float
          minimum: 50
          maximum: 260
          nullable: true
        weightKg:
          type: number
          format: float
          minimum: 20
          maximum: 500
          nullable: true
          description: Последняя запись веса.
        bmi:
          type: number
          format: float
          nullable: true
          readOnly: true
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        heightCm:
          type: number
          format: float
          minimum: 50
          maximum: 260
        weightKg:
          type: number
          format: float
          minimum: 20
          maximum: 500
          description: При изменении создаёт/обновляет запись веса за сегодня.

    GoalType:
      type: string
