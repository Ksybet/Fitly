      operationId: listAdminLogs
      summary: Получить технические логи ошибок
      description: |
        Возвращает технические логи в UTC, отсортированные от новых к старым по
        `timestamp DESC, id DESC`. Все переданные фильтры объединяются через AND;
        границы `from` и `to` включительны. Текстовый поиск регистронезависимо
        проверяет `message`, `stackTrace` и `requestId`. Только `role=admin`.
      x-requirements: [FITLY-063]
      parameters:
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/LogLevel'
        - name: service
          in: query
          description: Точное имя источника лога.
          schema:
            type: string
            maxLength: 100
        - name: userId
          in: query
          schema:
            type: integer
            format: int64
        - name: query
          in: query
          description: Поиск по сообщению, stack trace и request ID.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          description: Включительная нижняя UTC-граница диапазона.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Включительная верхняя UTC-граница диапазона.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Логи
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

