          type: boolean
          description: Включает генерацию напоминаний о воде; требует `waterIntervalMinutes`.
        waterIntervalMinutes:
          type: integer
          minimum: 30
          maximum: 1440
          description: Интервал сетки напоминаний, отсчитываемой от локальной полуночи пользователя.
