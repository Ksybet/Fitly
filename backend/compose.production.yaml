name: fitly-production

services:
  postgres:
    volumes:
      - fitly_postgres_production:/var/lib/postgresql/data

  api:
    build:
      target: production
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:${PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fitly_postgres_production:
