name: fitly

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: ${TZ:-Europe/Moscow}
      PGTZ: ${TZ:-Europe/Moscow}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      SYSTEM_LOG_RETENTION_DAYS: ${SYSTEM_LOG_RETENTION_DAYS:-90}
      POSTBOX_ACCESS_KEY_ID: ${POSTBOX_ACCESS_KEY_ID:-}
      POSTBOX_SECRET_ACCESS_KEY: ${POSTBOX_SECRET_ACCESS_KEY:-}
      POSTBOX_REGION: ${POSTBOX_REGION:-ru-central1}
      POSTBOX_ENDPOINT: ${POSTBOX_ENDPOINT:-https://postbox.cloud.yandex.net}
      POSTBOX_FROM_EMAIL: ${POSTBOX_FROM_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch(`http://127.0.0.1:$${process.env.PORT}/health`)
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  notification-worker:
    build:
      context: .
      target: production
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      NOTIFICATION_WORKER_POLL_MS: ${NOTIFICATION_WORKER_POLL_MS:-5000}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-100}
      NOTIFICATION_WORKER_LEASE_SECONDS: ${NOTIFICATION_WORKER_LEASE_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
