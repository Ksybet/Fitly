services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitly
      POSTGRES_PASSWORD: fitly
      POSTGRES_DB: fitly
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitly -d fitly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fitly_postgres_data:/var/lib/postgresql/data
      - ./.docker/001_create_test_database.sql:/docker-entrypoint-initdb.d/001_create_test_database.sql:ro

volumes:
  fitly_postgres_data:
