name: fitly-development

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - fitly_postgres_development:/var/lib/postgresql/data

  api:
    build:
      target: development
    environment:
      NODE_ENV: development
    command: ["node", "--watch", "src/server.js"]
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./src:/app/src:ro

volumes:
  fitly_postgres_development:
